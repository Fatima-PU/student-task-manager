<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Task Manager</h1>
    <p>Plan your study tasks in one place.</p>
    <form id="task-form" class="task-form">
      <input id="task-title" type="text" placeholder="Task title" required>
      <textarea id="task-desc" placeholder="Description"></textarea>
      <button type="submit" id="add-btn">Add Task</button>
    </form>

        <input id="search-box" type="text" placeholder="Search tasks...">

    <section id="task-list">
      <p>No tasks yet.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
